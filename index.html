      completedChapters: [], // ['ch1', 'ch2']

      bookmarks: [],         // [{ id, chapterId, chapterTitle, original, simple_explanation }]
      notes: [],             // [{ id, title, content, date }]
      settings: {
        darkMode: false,

    };

    // حالة التنقل والواجهات المؤقتة
    let ui = {
      screen: 'home',        // 'home' | 'chapter' | 'exam' | 'bookmarks' | 'notes' | 'settings'
      openParts: { part1: true, part2: false, part3: false, part4: false },
      searchQuery: '',

      expandedParagraphs: {},

      editingNoteId: null
    };

    /** تحميل حالة المستخدم من localStorage بأمان */
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = {
            ...state,
            ...parsed,
            settings: { ...state.settings, ...(parsed.settings || {}) }
          };
        }
      } catch (e) {
        console.warn('تعذر قراءة الحالة المحفوظة:', e);
      }
      applySettings();
    }

    /** حفظ حالة المستخدم في localStorage */
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('تعذر حفظ الحالة:', e);
      }
    }

    /** تطبيق الوضع الليلي وحجم الخط */
    function applySettings() {
      const htmlEl = document.documentElement;
      if (state.settings.darkMode) {
        htmlEl.classList.add('dark');
      } else {
        htmlEl.classList.remove('dark');
      }
      document.body.classList.remove('font-scale-sm', 'font-scale-md', 'font-scale-lg');
      document.body.classList.add(`font-scale-${state.settings.fontSize || 'md'}`);
    }

    /** تحميل بيانات الكتاب من ./book_data.json أو من الاستيراد المحلي أو الافتراضي */
    async function loadBookData() {
      // 1. التحقق إن كان المستخدم استورد ملف JSON مخصصاً مسبقاً
      try {
        const customSaved = localStorage.getItem(CUSTOM_DATA_KEY);
        if (customSaved) {
          const parsed = JSON.parse(customSaved);
          if (parsed && Array.isArray(parsed.parts) && parsed.parts.length > 0) {
            bookData = parsed;
            return;
          }
        }
      } catch (e) { /* تجاهل والانتقال للخيار التالي */ }

      // 2. محاولة جلب الملف الخارجي ./book_data.json (للاستضافة و APK)
      try {
        const response = await fetch('./book_data.json', { cache: 'no-store' });
        if (response.ok) {
          const externalData = await response.json();
          if (externalData && Array.isArray(externalData.parts) && externalData.parts.length > 0) {
            bookData = externalData;
            return;
          }
        }
      } catch (e) {
        // في حال المعاينة المباشرة بدون سيرفر خارجي، نستخدم البيانات المدمجة بصمت
      }

      // 3. البيانات الافتراضية المدمجة
      bookData = DEFAULT_BOOK_DATA;
    }

    /* =========================================================================
       3. دوال مساعدة (Helpers: Toast, Modal, Clipboard, Data Lookups)
       ========================================================================= */
    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-msg');
      msg.textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2400);
    }

    function openModal(title, body, actions) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      const actionsEl = document.getElementById('modal-actions');
      actionsEl.innerHTML = '';
      actions.forEach(act => {
        const btn = document.createElement('button');
        btn.textContent = act.label;
        btn.className = act.className;
        btn.onclick = () => {
          closeModal();
          if (act.onClick) act.onClick();
        };
        actionsEl.appendChild(btn);
      });
      const modal = document.getElementById('custom-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('custom-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    /** نسخ النص إلى الحافظة بطريقة متوافقة مع iFrame والموبايل */
    function copyTextToClipboard(text, successMsg = 'تم نسخ النص بنجاح') {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(successMsg);
      } catch (err) {
        showToast('تعذر نسخ النص');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getAllChapters() {
      const list = [];
      (bookData.parts || []).forEach(part => {
        (part.chapters || []).forEach(ch => {
          list.push({ ...ch, partId: part.id, partTitle: part.title });
        });
      });
      return list;
    }

    function getChapterById(id) {
      return getAllChapters().find(c => c.id === id) || null;
    }

    function getOverallProgress() {
      const all = getAllChapters();
      if (all.length === 0) return { completed: 0, total: 0, percent: 0 };
      const completed = all.filter(c => state.completedChapters.includes(c.id)).length;
      return {
        completed,
        total: all.length,
        percent: Math.round((completed / all.length) * 100)
      };
    }

    /* =========================================================================
       4. التنقل وتحديث الواجهة (Navigation & Rendering)
       ========================================================================= */
    function navigateTo(screen) {
      ui.screen = screen;
      if (screen !== 'chapter') {
        ui.currentChapterId = null;
      }
      if (screen !== 'exam' && screen !== 'chapter') {
        ui.quiz = null;
      }
      window.scrollTo({ top: 0, behavior: 'instant' });
      render();
    }

    function openChapter(chapterId, defaultTab = 'explain') {
      ui.currentChapterId = chapterId;
      ui.chapterTab = defaultTab;
      ui.screen = 'chapter';
      ui.quiz = null;
      if (defaultTab === 'quiz') {
        initChapterQuiz(chapterId);
      }
      window.scrollTo({ top: 0, behavior: 'instant' });
      render();
    }

    function updateBottomNav() {
      const buttons = document.querySelectorAll('.nav-btn');
      const activeKey = (ui.screen === 'chapter' || ui.screen === 'exam') ? 'home' : ui.screen;
      buttons.forEach(btn => {
        const key = btn.getAttribute('data-nav');
        if (key === activeKey) {
          btn.classList.add('text-emeraldDeep-800', 'dark:text-goldSoft-400', 'bg-emerald-50', 'dark:bg-emerald-950/70');
          btn.classList.remove('text-stone-400', 'dark:text-stone-500');
        } else {
          btn.classList.remove('text-emeraldDeep-800', 'dark:text-goldSoft-400', 'bg-emerald-50', 'dark:bg-emerald-950/70');
          btn.classList.add('text-stone-400', 'dark:text-stone-500');
        }
      });
    }

    function render() {
      updateBottomNav();
      const container = document.getElementById('main-content');
      if (ui.screen === 'home') {
        container.innerHTML = renderHomeScreen();
      } else if (ui.screen === 'chapter') {
        container.innerHTML = renderChapterScreen();
      } else if (ui.screen === 'exam') {
        container.innerHTML = renderExamScreen();
      } else if (ui.screen === 'bookmarks') {
        container.innerHTML = renderBookmarksScreen();
      } else if (ui.screen === 'notes') {
        container.innerHTML = renderNotesScreen();
      } else if (ui.screen === 'settings') {
        container.innerHTML = renderSettingsScreen();
      }
    }

    /* =========================================================================
       5. الشاشة الرئيسية (Home Screen)

              <div class="w-9 h-9 rounded-2xl bg-stone-100 dark:bg-[#0d1613] flex items-center justify-center shrink-0 transition-transform duration-200 ${isOpen ? 'rotate-180 bg-emerald-50 dark:bg-emerald-950 text-emeraldDeep-700 dark:text-goldSoft-400' : 'text-stone-400'}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </button>
            ${isOpen ? `<div class="px-3.5 pb-3.5 space-y-2 animate-fade-slide">${chaptersHtml}</div>` : ''}
          </div>
        `;
      }).join('');

      return `
        <!-- الهيدر العلوي -->
        <header class="bg-gradient-to-bl from-emeraldDeep-900 via-emeraldDeep-800 to-emeraldDeep-950 text-white rounded-b-[2rem] px-5 pt-6 pb-7 shadow-lg header-pattern relative overflow-hidden">
          <div class="flex items-start justify-between gap-3 relative z-10">
            <div>
              <span class="inline-block px-2.5 py-0.5 rounded-full bg-goldSoft-500/20 border border-goldSoft-400/30 text-goldSoft-400 text-[11px] font-bold mb-2">

            <svg class="w-5 h-5 text-stone-400 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            ${ui.searchQuery ? `

              </div>

    }

    function renderSearchResults(query) {
      const q = query.toLowerCase();
      const results = [];
      getAllChapters().forEach(ch => {
        if (ch.title.toLowerCase().includes(q)) {
          results.push({ type: 'فصل', chapterId: ch.id, title: ch.title, snippet: ch.partTitle });
        }
        (ch.paragraphs || []).forEach(p => {
          if (p.original.toLowerCase().includes(q) || p.simple_explanation.toLowerCase().includes(q)) {
            results.push({
              type: 'فقرة وشرح',
              chapterId: ch.id,
              title: ch.title,
              snippet: p.simple_explanation.toLowerCase().includes(q) ? p.simple_explanation : p.original
            });
          }
        });
      });

      if (results.length === 0) {
        return `
          <div class="bg-white dark:bg-[#14221d] rounded-3xl p-8 text-center border border-stone-200 dark:border-emerald-900/50">
            <div class="text-3xl mb-2">🔍</div>
            <p class="font-heading font-bold text-stone-700 dark:text-stone-200">لا توجد نتائج مطابقة لـ "${escapeHtml(query)}"</p>
            <p class="text-xs text-stone-500 mt-1">جرب البحث بكلمة مفتاحية أخرى مثل: الإجماع، الشر، الحرية، العقل.</p>
          </div>
        `;
      }

      return `
        <div class="space-y-2.5 animate-fade-slide">
          <div class="text-xs font-bold text-stone-500 dark:text-stone-400 px-1">نتائج البحث (${results.length})</div>
          ${results.slice(0, 20).map(r => `
            <button onclick="openChapter('${r.chapterId}')" class="w-full text-right bg-white dark:bg-[#14221d] p-3.5 rounded-2xl border border-stone-200 dark:border-emerald-900/50 shadow-xs hover:border-emeraldDeep-600 transition-all">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="font-heading font-bold text-sm text-emeraldDeep-900 dark:text-goldSoft-400">${escapeHtml(r.title)}</span>
                <span class="text-[10px] px-2 py-0.5 rounded-lg bg-emerald-50 dark:bg-emerald-950 text-emeraldDeep-700 dark:text-emerald-300 font-bold shrink-0">${r.type}</span>
              </div>
              <p class="text-xs text-stone-600 dark:text-stone-300 line-clamp-2 leading-relaxed">${escapeHtml(r.snippet)}</p>
            </button>
          `).join('')}
        </div>
      `;
    }

    function togglePart(partId) {
      ui.openParts[partId] = !ui.openParts[partId];
      render();
    }

    function handleSearchInput(val) {
      ui.searchQuery = val;
      render();
      // إعادة التركيز لخانة البحث بعد إعادة الرسم
      const input = document.querySelector('input[type="text"]');
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    }

    function clearSearch() {
      ui.searchQuery = '';
      render();
    }

    /* =========================================================================
       6. شاشة الفصل (Chapter Screen: الشرح المبسط + بنك الأسئلة)
       ========================================================================= */
    function renderChapterScreen() {
      const ch = getChapterById(ui.currentChapterId);
      if (!ch) {
        navigateTo('home');
        return '';
      }
      const isDone = state.completedChapters.includes(ch.id);

      return `
        <!-- الشريط العلوي الثابت للفصل -->
        <div class="sticky top-0 z-30 bg-white/95 dark:bg-[#13201c]/95 backdrop-blur-md border-b border-stone-200 dark:border-emerald-900/50 px-4 pt-3.5 pb-3 shadow-xs">
          <div class="flex items-center justify-between gap-2 mb-3">
            <button onclick="navigateTo('home')" class="p-2 -mr-1 rounded-xl bg-stone-100 dark:bg-[#0d1613] text-stone-700 dark:text-stone-200 active:scale-95 transition-all" aria-label="رجوع">

            </div>
            <button onclick="toggleChapterComplete('${ch.id}')" class="px-2.5 py-2 rounded-xl text-[11px] font-bold flex items-center gap-1 shrink-0 transition-all ${isDone ? 'bg-emeraldDeep-600 text-white' : 'bg-stone-100 dark:bg-[#0d1613] text-stone-600 dark:text-stone-300 border border-stone-200 dark:border-emerald-900'}">
              <span>${isDone ? '✓ مكتمل' : 'تحديد كمكتمل'}</span>
            </button>
          </div>

          <!-- تبويبات الفصل -->
          <div class="grid grid-cols-2 gap-1.5 bg-stone-100 dark:bg-[#0b1311] p-1 rounded-2xl">
            <button onclick="switchChapterTab('explain')" class="py-2 rounded-xl text-xs font-heading font-bold transition-all ${ui.chapterTab === 'explain' ? 'bg-white dark:bg-emeraldDeep-800 text-emeraldDeep-900 dark:text-white shadow-xs' : 'text-stone-500 dark:text-stone-400'}">
              📖 الشرح المبسط (${(ch.paragraphs || []).length})
            </button>
            <button onclick="switchChapterTab('quiz')" class="py-2 rounded-xl text-xs font-heading font-bold transition-all ${ui.chapterTab === 'quiz' ? 'bg-white dark:bg-emeraldDeep-800 text-emeraldDeep-900 dark:text-white shadow-xs' : 'text-stone-500 dark:text-stone-400'}">
              ✍️ بنك الأسئلة (${(ch.questions || []).length})

          </div>
        </div>

        <div class="p-4 animate-fade-slide">
          ${ui.chapterTab === 'explain' ? renderChapterParagraphs(ch) : renderQuizBody()}
        </div>
      `;
    }

    function renderChapterParagraphs(ch) {
      const paragraphs = ch.paragraphs || [];
      if (paragraphs.length === 0) {
        return `<div class="text-center py-12 text-stone-500">لا توجد فقرات مضافة لهذا الفصل بعد.</div>`;
      }

      const cards = paragraphs.map((p, idx) => {
        const isExpanded = !!ui.expandedParagraphs[p.id];
        const isBookmarked = state.bookmarks.some(b => b.id === p.id);

        return `
          <article class="bg-white dark:bg-[#14221d] rounded-3xl p-4 border border-stone-200/80 dark:border-emerald-900/50 shadow-xs space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-0.5 rounded-lg bg-emerald-50 dark:bg-emerald-950 text-emeraldDeep-800 dark:text-emerald-300 text-[11px] font-bold">فكرة ${idx + 1}</span>
              <div class="flex items-center gap-1.5">
                <button onclick="copyParagraph('${ch.id}', '${p.id}')" class="p-2 rounded-xl bg-stone-100 dark:bg-[#0d1613] text-stone-500 dark:text-stone-300 hover:text-emeraldDeep-700 transition-colors" title="نسخ ومشاركة">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                </button>
                <button onclick="toggleBookmark('${ch.id}', '${p.id}')" class="p-2 rounded-xl transition-colors ${isBookmarked ? 'bg-amber-100 dark:bg-amber-900/40 text-goldSoft-600 dark:text-goldSoft-400' : 'bg-stone-100 dark:bg-[#0d1613] text-stone-400'}" title="حفظ في المفضلة">
                  <svg class="w-4 h-4" fill="${isBookmarked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                </button>
              </div>
            </div>

            <!-- النص الأصلي / الفكرة الأساسية -->
            <p class="reading-text text-stone-800 dark:text-stone-100 font-medium">${escapeHtml(p.original)}</p>

            <!-- زر الشرح المبسط -->
            <button onclick="toggleSimpleExplanation('${p.id}')" class="w-full py-2.5 px-3.5 rounded-2xl text-xs font-heading font-bold flex items-center justify-between transition-all ${isExpanded ? 'bg-emeraldDeep-900 text-white' : 'bg-amber-50 dark:bg-amber-950/30 text-amber-800 dark:text-goldSoft-400 border border-amber-200/80 dark:border-amber-800/40'}">
              <span class="flex items-center gap-1.5">
                <span>💡</span>
                <span>${isExpanded ? 'إخفاء الشرح المبسط' : 'اشرح لي ببساطة'}</span>
              </span>
              <svg class="w-4 h-4 transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
            </button>

            <!-- صندوق الشرح المبسط -->
            ${isExpanded ? `
              <div class="p-3.5 rounded-2xl bg-emerald-50/90 dark:bg-emerald-950/50 border-r-4 border-goldSoft-500 animate-fade-slide">
                <div class="text-[11px] font-heading font-bold text-emeraldDeep-800 dark:text-goldSoft-400 mb-1">الشرح المبسط والمثال:</div>
                <p class="reading-text text-stone-700 dark:text-stone-200">${escapeHtml(p.simple_explanation)}</p>
              </div>
            ` : ''}
          </article>
        `;
      }).join('');

      return `
        <div class="space-y-3.5">
          ${cards}
          <button onclick="switchChapterTab('quiz')" class="w-full py-3.5 rounded-2xl bg-emeraldDeep-800 hover:bg-emeraldDeep-900 text-white font-heading font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2 mt-4">
            <span>اختبر فهمك في هذا الفصل</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          </button>
        </div>
      `;
    }

    function toggleSimpleExplanation(pId) {
      ui.expandedParagraphs[pId] = !ui.expandedParagraphs[pId];
      render();
    }

    function switchChapterTab(tab) {
      ui.chapterTab = tab;
      if (tab === 'quiz' && (!ui.quiz || ui.quiz.chapterId !== ui.currentChapterId)) {
        initChapterQuiz(ui.currentChapterId);
      }
      render();
    }

    function toggleChapterComplete(chId) {
      const idx = state.completedChapters.indexOf(chId);
      if (idx >= 0) {
        state.completedChapters.splice(idx, 1);
        showToast('تم إلغاء تحديد الفصل كمكتمل');
      } else {
        state.completedChapters.push(chId);
        state.points += 10;
        showToast('أحسنت! تم تحديد الفصل كمكتمل (+10 نقاط)');
      }
      saveState();
      render();
    }

    function toggleBookmark(chId, pId) {
      const ch = getChapterById(chId);
      if (!ch) return;
      const p = (ch.paragraphs || []).find(item => item.id === pId);
      if (!p) return;

      const existingIdx = state.bookmarks.findIndex(b => b.id === pId);
      if (existingIdx >= 0) {
        state.bookmarks.splice(existingIdx, 1);
        showToast('تمت الإزالة من المفضلة');
      } else {
        state.bookmarks.unshift({
          id: p.id,
          chapterId: ch.id,
          chapterTitle: ch.title,
          original: p.original,
          simple_explanation: p.simple_explanation
        });
        showToast('تم الحفظ في المفضلة');
      }
      saveState();
      render();
    }

    function copyParagraph(chId, pId) {
      const ch = getChapterById(chId);
      const p = ch?.paragraphs?.find(item => item.id === pId);
      if (!p) return;
      const text = `من كتاب «كامل الصورة» - ${ch.title}:\n\n${p.original}\n\n💡 الشرح المبسط:\n${p.simple_explanation}`;
      copyTextToClipboard(text, 'تم نسخ الفقرة والشرح للمشاركة');
    }

    /* =========================================================================
       7. محرك الاختبارات (Quiz Engine للفصل والاختبار الشامل)
       ========================================================================= */
    function initChapterQuiz(chapterId) {
      const ch = getChapterById(chapterId);
      const qs = (ch?.questions || []).map(q => ({ ...q, chapterTitle: ch.title }));
      ui.quiz = {
        mode: 'chapter',
        chapterId,
        questions: qs,
        currentIndex: 0,
        answers: [], // { questionIndex, selectedIndex, isCorrect }
        finished: false,
        reviewingMistakes: false
      };
    }

    function startComprehensiveExam() {
      const allQuestions = [];
      getAllChapters().forEach(ch => {
        (ch.questions || []).forEach(q => {
          allQuestions.push({ ...q, chapterTitle: ch.title });
        });
      });
      // خلط عشوائي (Fisher-Yates)
      for (let i = allQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
      }
      const selected = allQuestions.slice(0, Math.min(15, allQuestions.length));
      ui.quiz = {
        mode: 'exam',
        chapterId: null,
        questions: selected,
        currentIndex: 0,
        answers: [],
        finished: false,
        reviewingMistakes: false
      };
      ui.screen = 'exam';
      window.scrollTo({ top: 0, behavior: 'instant' });
      render();
    }

    function renderExamScreen() {
      return `
        <div class="sticky top-0 z-30 bg-white/95 dark:bg-[#13201c]/95 backdrop-blur-md border-b border-stone-200 dark:border-emerald-900/50 px-4 py-3.5 flex items-center justify-between gap-2">
          <button onclick="navigateTo('home')" class="p-2 -mr-1 rounded-xl bg-stone-100 dark:bg-[#0d1613] text-stone-700 dark:text-stone-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </button>
          <div class="text-center flex-1">
            <div class="text-[10px] font-bold text-goldSoft-600 dark:text-goldSoft-400">تحدي كامل الصورة</div>
            <h2 class="font-heading font-extrabold text-sm text-stone-900 dark:text-stone-50">الاختبار الشامل للكتاب</h2>
          </div>
          <div class="w-9"></div>
        </div>
        <div class="p-4 animate-fade-slide">
          ${renderQuizBody()}
        </div>
      `;
    }

    function renderQuizBody() {
      const qz = ui.quiz;
      if (!qz || !qz.questions || qz.questions.length === 0) {
        return `<div class="text-center py-12 text-stone-500">لا توجد أسئلة متاحة حالياً.</div>`;
      }

      // شاشة مراجعة الأخطاء
      if (qz.finished && qz.reviewingMistakes) {
        const mistakes = qz.answers.filter(a => !a.isCorrect);
        return `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="font-heading font-extrabold text-base text-rose-700 dark:text-rose-400">مراجعة الأخطاء (${mistakes.length})</h3>
              <button onclick="toggleMistakesReview(false)" class="text-xs font-bold text-emeraldDeep-700 dark:text-goldSoft-400 underline">العودة للنتيجة</button>
            </div>
            ${mistakes.map(m => {
              const qObj = qz.questions[m.questionIndex];
              return `
                <div class="bg-white dark:bg-[#14221d] rounded-3xl p-4 border border-rose-200 dark:border-rose-900/50 space-y-2.5">
                  <div class="text-[11px] font-bold text-stone-400">${escapeHtml(qObj.chapterTitle || '')}</div>
                  <p class="font-heading font-bold text-sm text-stone-900 dark:text-stone-50">${escapeHtml(qObj.q)}</p>
                  <div class="text-xs p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300">
                    <strong>إجابتك:</strong> ${escapeHtml(qObj.options[m.selectedIndex])}
                  </div>
                  <div class="text-xs p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emeraldDeep-800 dark:text-emerald-300">
                    <strong>الإجابة الصحيحة:</strong> ${escapeHtml(qObj.options[qObj.correct_index])}
                  </div>
                  ${qObj.hint ? `<div class="text-xs text-stone-600 dark:text-stone-300 pt-1">💡 ${escapeHtml(qObj.hint)}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // شاشة النتيجة النهائية
      if (qz.finished) {
        const total = qz.questions.length;
        const correctCount = qz.answers.filter(a => a.isCorrect).length;
        const percent = Math.round((correctCount / total) * 100);
        const mistakesCount = total - correctCount;
        let badge = 'ممتاز! إتقان رائع';
        let emoji = '🏆';
        if (percent < 50) { badge = 'تحتاج لمراجعة الفصل مرة أخرى'; emoji = '📚'; }
        else if (percent < 80) { badge = 'جيد جداً! اقتربت من الإتقان'; emoji = '🌟'; }

        return `
          <div class="bg-white dark:bg-[#14221d] rounded-3xl p-6 text-center border border-stone-200 dark:border-emerald-900/50 shadow-sm space-y-4 animate-fade-slide">
            <div class="text-5xl">${emoji}</div>
            <div>
              <h3 class="font-heading font-extrabold text-xl text-emeraldDeep-900 dark:text-stone-50">${badge}</h3>
              <p class="text-xs text-stone-500 dark:text-stone-400 mt-1">أنهيت الاختبار بنجاح وتم حفظ نتيجتك</p>
            </div>
            <div class="grid grid-cols-2 gap-3 py-2">
              <div class="p-3.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60">
                <div class="font-heading font-extrabold text-2xl text-emeraldDeep-800 dark:text-emerald-300">${correctCount} / ${total}</div>
                <div class="text-[11px] text-stone-500 dark:text-stone-400">الإجابات الصحيحة</div>
              </div>
              <div class="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40">
                <div class="font-heading font-extrabold text-2xl text-goldSoft-600 dark:text-goldSoft-400">${percent}%</div>
                <div class="text-[11px] text-stone-500 dark:text-stone-400">نسبة الإنجاز</div>
              </div>
            </div>
            <div class="space-y-2.5 pt-2">
              ${mistakesCount > 0 ? `
                <button onclick="toggleMistakesReview(true)" class="w-full py-3 rounded-2xl bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-900 font-heading font-bold text-sm">
                  مراجعة الأخطاء (${mistakesCount})
                </button>
              ` : ''}
              <button onclick="${qz.mode === 'exam' ? 'startComprehensiveExam()' : `restartChapterQuiz('${qz.chapterId}')`}" class="w-full py-3 rounded-2xl bg-emeraldDeep-800 text-white font-heading font-bold text-sm shadow-sm">
                إعادة الاختبار
              </button>
              <button onclick="navigateTo('home')" class="w-full py-3 rounded-2xl bg-stone-100 dark:bg-[#0d1613] text-stone-700 dark:text-stone-200 font-heading font-bold text-sm">
                العودة للرئيسية
              </button>
            </div>
          </div>
        `;
      }

      // شاشة السؤال الحالي
      const currentQ = qz.questions[qz.currentIndex];
      const answeredObj = qz.answers.find(a => a.questionIndex === qz.currentIndex);
      const progressPct = Math.round(((qz.currentIndex + (answeredObj ? 1 : 0)) / qz.questions.length) * 100);

      const optionsHtml = currentQ.options.map((opt, idx) => {
        let btnClass = 'bg-stone-50 dark:bg-[#0f1b17] border-stone-200 dark:border-emerald-900/50 text-stone-800 dark:text-stone-100 hover:border-emeraldDeep-600';
        let icon = `<span class="w-6 h-6 rounded-full border border-stone-300 dark:border-stone-600 text-[11px] flex items-center justify-center shrink-0 font-bold">${['أ', 'ب', 'ج', 'د'][idx] || (idx + 1)}</span>`;

        if (answeredObj) {
          if (idx === currentQ.correct_index) {
            btnClass = 'bg-emerald-50 dark:bg-emerald-950/70 border-emeraldDeep-600 text-emeraldDeep-900 dark:text-emerald-200 font-bold';
            icon = `<span class="w-6 h-6 rounded-full bg-emeraldDeep-600 text-white text-xs flex items-center justify-center shrink-0">✓</span>`;
          } else if (idx === answeredObj.selectedIndex && !answeredObj.isCorrect) {
            btnClass = 'bg-rose-50 dark:bg-rose-950/60 border-rose-500 text-rose-800 dark:text-rose-200';
            icon = `<span class="w-6 h-6 rounded-full bg-rose-500 text-white text-xs flex items-center justify-center shrink-0">✕</span>`;
          } else {
            btnClass = 'bg-stone-50/60 dark:bg-[#0f1b17]/50 border-stone-200/50 dark:border-stone-800 text-stone-400 opacity-70';
          }
        }

        return `
          <button onclick="selectQuizOption(${idx})" ${answeredObj ? 'disabled' : ''} class="w-full text-right p-3.5 rounded-2xl border-2 flex items-center gap-3 transition-all ${btnClass}">
            ${icon}
            <span class="reading-text text-sm leading-snug">${escapeHtml(opt)}</span>
          </button>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          <!-- شريط تقدم الاختبار -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-xs font-bold text-stone-500 dark:text-stone-400">
              <span>السؤال ${qz.currentIndex + 1} من ${qz.questions.length}</span>
              ${qz.mode === 'exam' ? `<span class="text-emeraldDeep-700 dark:text-goldSoft-400 truncate max-w-[60%]">${escapeHtml(currentQ.chapterTitle)}</span>` : `<span>${progressPct}%</span>`}
            </div>
            <div class="w-full h-2 bg-stone-200 dark:bg-stone-800 rounded-full overflow-hidden">
              <div class="h-full bg-emeraldDeep-600 dark:bg-goldSoft-500 rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <!-- بطاقة السؤال -->
          <div class="bg-white dark:bg-[#14221d] rounded-3xl p-4 border border-stone-200 dark:border-emerald-900/50 shadow-xs space-y-4">
            <h3 class="font-heading font-bold text-base text-stone-900 dark:text-stone-50 leading-relaxed">${escapeHtml(currentQ.q)}</h3>
            <div class="space-y-2.5">${optionsHtml}</div>

            <!-- صندوق التوضيح بعد الإجابة -->
            ${answeredObj ? `
              <div class="p-3.5 rounded-2xl animate-fade-slide ${answeredObj.isCorrect ? 'bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800' : 'bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/50'}">
                <div class="font-heading font-bold text-xs mb-1 ${answeredObj.isCorrect ? 'text-emeraldDeep-800 dark:text-emerald-300' : 'text-amber-800 dark:text-goldSoft-400'}">
                  ${answeredObj.isCorrect ? '✓ إجابة صحيحة!' : '💡 توضيح الإجابة الصحيحة:'}
                </div>
                <p class="text-xs text-stone-700 dark:text-stone-200 leading-relaxed">${escapeHtml(currentQ.hint || 'راجع فقرات الفصل لمزيد من التفصيل.')}</p>
              </div>

              <button onclick="nextQuizQuestion()" class="w-full py-3.5 rounded-2xl bg-emeraldDeep-800 hover:bg-emeraldDeep-900 text-white font-heading font-bold text-sm shadow-sm transition-all">
                ${qz.currentIndex + 1 < qz.questions.length ? 'السؤال التالي ←' : 'عرض النتيجة النهائية'}
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function selectQuizOption(optIdx) {
      const qz = ui.quiz;
      if (!qz || qz.answers.some(a => a.questionIndex === qz.currentIndex)) return;
      const currentQ = qz.questions[qz.currentIndex];
      const isCorrect = optIdx === currentQ.correct_index;
      qz.answers.push({ questionIndex: qz.currentIndex, selectedIndex: optIdx, isCorrect });
      if (isCorrect) {
        state.points += 5;
        saveState();
      }
      render();
    }

    function nextQuizQuestion() {
      const qz = ui.quiz;
      if (!qz) return;
      if (qz.currentIndex + 1 < qz.questions.length) {
        qz.currentIndex += 1;
      } else {
        qz.finished = true;
        const correctCount = qz.answers.filter(a => a.isCorrect).length;
        const total = qz.questions.length;
        if (qz.mode === 'chapter' && qz.chapterId) {
          const prev = state.bestScores[qz.chapterId];
          if (!prev || correctCount > prev.score) {
            state.bestScores[qz.chapterId] = { score: correctCount, total };
          }
          if (correctCount / total >= 0.7 && !state.completedChapters.includes(qz.chapterId)) {
            state.completedChapters.push(qz.chapterId);
          }
          saveState();
        }
      }
      render();
    }

    function toggleMistakesReview(flag) {
      if (ui.quiz) {
        ui.quiz.reviewingMistakes = flag;
        render();
      }
    }

    function restartChapterQuiz(chapterId) {
      initChapterQuiz(chapterId);
      render();
    }

    /* =========================================================================
       8. شاشة المفضلة (Bookmarks Screen)
       ========================================================================= */
    function renderBookmarksScreen() {
      const list = state.bookmarks || [];
      return `
        <header class="bg-emeraldDeep-900 text-white px-5 py-6 rounded-b-3xl shadow-md header-pattern">
          <h1 class="font-heading font-extrabold text-xl">المفضلة</h1>
          <p class="text-xs text-emerald-100/85 mt-1">الفقرات والشروحات التي حفظتها للمراجعة السريعة (${list.length})</p>
        </header>

        <div class="p-4 space-y-3 animate-fade-slide">
          ${list.length === 0 ? `
            <div class="bg-white dark:bg-[#14221d] rounded-3xl p-10 text-center border border-stone-200 dark:border-emerald-900/50 mt-4">
              <div class="text-4xl mb-3">🔖</div>
              <h3 class="font-heading font-bold text-stone-800 dark:text-stone-100">المفضلة فارغة حالياً</h3>
              <p class="text-xs text-stone-500 dark:text-stone-400 mt-1.5 leading-relaxed">اضغط على أيقونة الحفظ داخل أي فقرة في الفصول لتجدها هنا وقت المراجعة.</p>
            </div>
          ` : list.map(b => `
            <div class="bg-white dark:bg-[#14221d] rounded-3xl p-4 border border-stone-200 dark:border-emerald-900/50 shadow-xs space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <button onclick="openChapter('${b.chapterId}')" class="text-xs font-heading font-bold text-emeraldDeep-700 dark:text-goldSoft-400 hover:underline truncate">${escapeHtml(b.chapterTitle)}</button>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button onclick="copySavedBookmark('${b.id}')" class="p-1.5 rounded-xl bg-stone-100 dark:bg-[#0d1613] text-stone-500 dark:text-stone-300 text-xs" title="نسخ">📋</button>
                  <button onclick="removeBookmark('${b.id}')" class="p-1.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 text-xs" title="حذف">🗑️</button>
                </div>
              </div>
              <p class="reading-text text-stone-800 dark:text-stone-100">${escapeHtml(b.original)}</p>
              <div class="p-3 rounded-2xl bg-emerald-50/80 dark:bg-emerald-950/40 border-r-3 border-goldSoft-500">
                <div class="text-[11px] font-bold text-emeraldDeep-800 dark:text-goldSoft-400 mb-0.5">💡 الشرح المبسط:</div>
                <p class="text-xs text-stone-700 dark:text-stone-200 leading-relaxed">${escapeHtml(b.simple_explanation)}</p>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function removeBookmark(id) {
      state.bookmarks = state.bookmarks.filter(b => b.id !== id);
      saveState();
      showToast('تم حذف العنصر من المفضلة');
      render();
    }

    function copySavedBookmark(id) {
      const b = state.bookmarks.find(item => item.id === id);
      if (!b) return;
      copyTextToClipboard(`من كتاب «كامل الصورة» - ${b.chapterTitle}:\n\n${b.original}\n\n💡 الشرح المبسط:\n${b.simple_explanation}`);
    }

    /* =========================================================================
       9. شاشة المفكرة الشخصية (Notes Screen)
       ========================================================================= */
    function renderNotesScreen() {
      const notes = state.notes || [];
      const editingNote = ui.editingNoteId ? notes.find(n => n.id === ui.editingNoteId) : null;

      return `
        <header class="bg-emeraldDeep-900 text-white px-5 py-6 rounded-b-3xl shadow-md header-pattern">
          <h1 class="font-heading font-extrabold text-xl">المفكرة الشخصية</h1>
          <p class="text-xs text-emerald-100/85 mt-1">سجّل فوائدك، تأملاتك، وأسئلتك أثناء قراءة الكتاب</p>
        </header>

        <div class="p-4 space-y-4 animate-fade-slide">
          <!-- نموذج إضافة / تعديل ملاحظة -->
          <div class="bg-white dark:bg-[#14221d] rounded-3xl p-4 border border-stone-200 dark:border-emerald-900/50 shadow-xs space-y-3">
            <div class="font-heading font-bold text-sm text-emeraldDeep-900 dark:text-goldSoft-400">
              ${editingNote ? 'تعديل الملاحظة' : '✍️ أضف فائدة جديدة'}
            </div>
            <input id="note-title-input" type="text" value="${escapeHtml(editingNote ? editingNote.title : '')}" placeholder="عنوان الفائدة أو اسم الفصل..." class="w-full bg-stone-50 dark:bg-[#0d1613] text-sm rounded-2xl px-3.5 py-2.5 border border-stone-200 dark:border-emerald-900/50 focus:outline-none focus:ring-2 focus:ring-emeraldDeep-600" />
            <textarea id="note-content-input" rows="3" placeholder="اكتب ملاحظتك أو تلخيصك الخاص هنا..." class="w-full bg-stone-50 dark:bg-[#0d1613] text-sm rounded-2xl px-3.5 py-2.5 border border-stone-200 dark:border-emerald-900/50 focus:outline-none focus:ring-2 focus:ring-emeraldDeep-600 resize-none">${escapeHtml(editingNote ? editingNote.content : '')}</textarea>
            <div class="flex items-center gap-2">
              <button onclick="saveNote()" class="flex-1 py-2.5 rounded-2xl bg-emeraldDeep-800 hover:bg-emeraldDeep-900 text-white font-heading font-bold text-xs shadow-xs">
                ${editingNote ? 'حفظ التعديلات' : 'حفظ في المفكرة'}
              </button>
              ${editingNote ? `
                <button onclick="cancelEditNote()" class="px-4 py-2.5 rounded-2xl bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 font-bold text-xs">إلغاء</button>
              ` : ''}
            </div>
          </div>

          <!-- قائمة الملاحظات المحفوظة -->
          <div class="space-y-3">
            ${notes.length === 0 ? `
              <div class="text-center py-8 text-stone-400 text-xs">لا توجد ملاحظات مسجلة بعد. ابدأ بكتابة أول فائدة!</div>
            ` : notes.map(n => `
              <div class="bg-white dark:bg-[#14221d] rounded-3xl p-4 border border-stone-200 dark:border-emerald-900/50 shadow-xs space-y-2">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <h4 class="font-heading font-bold text-sm text-stone-900 dark:text-stone-50">${escapeHtml(n.title)}</h4>
                    <span class="text-[10px] text-stone-400">${escapeHtml(n.date)}</span>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button onclick="startEditNote('${n.id}')" class="p-1.5 rounded-xl bg-stone-100 dark:bg-[#0d1613] text-stone-500 text-xs" title="تعديل">✏️</button>
                    <button onclick="confirmDeleteNote('${n.id}')" class="p-1.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 text-xs" title="حذف">🗑️</button>
                  </div>
                </div>
                <p class="reading-text text-stone-700 dark:text-stone-300 whitespace-pre-line">${escapeHtml(n.content)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function saveNote() {
      const titleEl = document.getElementById('note-title-input');
      const contentEl = document.getElementById('note-content-input');
      const title = (titleEl?.value || '').trim() || 'فائدة بدون عنوان';
      const content = (contentEl?.value || '').trim();
      if (!content) {
        showToast('يرجى كتابة نص الملاحظة أولاً');
        return;
      }
      const nowStr = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
      if (ui.editingNoteId) {
        const idx = state.notes.findIndex(n => n.id === ui.editingNoteId);
        if (idx >= 0) {
          state.notes[idx] = { ...state.notes[idx], title, content, date: `معدّل: ${nowStr}` };
        }
        ui.editingNoteId = null;
        showToast('تم تحديث الملاحظة');
      } else {
        state.notes.unshift({
          id: 'note_' + Date.now(),
          title,
          content,
          date: nowStr
        });
        showToast('تم حفظ الفائدة في المفكرة');
      }
      saveState();
      render();
    }

    function startEditNote(id) {
      ui.editingNoteId = id;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEditNote() {
      ui.editingNoteId = null;
      render();
    }

    function confirmDeleteNote(id) {
      openModal('حذف الملاحظة', 'هل أنت متأكد من رغبتك في حذف هذه الملاحظة نهائياً من المفكرة؟', [
        { label: 'إلغاء', className: 'px-4 py-2 rounded-xl bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 text-xs font-bold' },
        {
          label: 'نعم، احذف',
          className: 'px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold',
          onClick: () => {
            state.notes = state.notes.filter(n => n.id !== id);
            if (ui.editingNoteId === id) ui.editingNoteId = null;
            saveState();
            showToast('تم حذف الملاحظة');
            render();
          }
        }
      ]);
    }

    /* =========================================================================
       10. شاشة الإعدادات وإدارة ملف JSON (Settings Screen)
       ========================================================================= */
    function renderSettingsScreen() {
      const fs = state.settings.fontSize;
      return `
        <header class="bg-emeraldDeep-900 text-white px-5 py-6 rounded-b-3xl shadow-md header-pattern">
          <h1 class="font-heading font-extrabold text-xl">الإعدادات والبيانات</h1>
          <p class="text-xs text-emerald-100/85 mt-1">خصّص تجربة القراءة وأدِر ملف book_data.json</p>
        </header>

        <div class="p-4 space-y-4 animate-fade-slide">
          <!-- المظهر والقراءة -->
          <div class="bg-white dark:bg-[#14221d] rounded-3xl p-4 border border-stone-200 dark:border-emerald-900/50 space-y-4">
            <h3 class="font-heading font-bold text-sm text-emeraldDeep-900 dark:text-goldSoft-400">المظهر والقراءة</h3>

            <!-- الوضع الليلي -->
            <div class="flex items-center justify-between">
              <div>
                <div class="font-bold text-sm">الوضع الليلي (Dark Mode)</div>
                <div class="text-[11px] text-stone-500 dark:text-stone-400">مريح للعين أثناء القراءة المسائية</div>
              </div>
              <button onclick="toggleDarkMode()" class="w-13 h-7 rounded-full p-1 transition-colors flex items-center ${state.settings.darkMode ? 'bg-emeraldDeep-600 justify-end' : 'bg-stone-300 justify-start'}" style="width: 52px;">
                <span class="w-5 h-5 rounded-full bg-white shadow-sm block"></span>
              </button>
            </div>

            <!-- حجم الخط -->
            <div class="pt-2 border-t border-stone-100 dark:border-emerald-900/40">
              <div class="font-bold text-sm mb-2.5">حجم خط القراءة</div>
              <div class="grid grid-cols-3 gap-2">
                ${[
                  { key: 'sm', label: 'صغير' },
                  { key: 'md', label: 'متوسط' },
                  { key: 'lg', label: 'كبير' }
                ].map(item => `
                  <button onclick="setFontSize('${item.key}')" class="py-2.5 rounded-2xl text-xs font-heading font-bold border transition-all ${fs === item.key ? 'bg-emeraldDeep-800 text-white border-emeraldDeep-800' : 'bg-stone-50 dark:bg-[#0d1613] text-stone-600 dark:text-stone-300 border-stone-200 dark:border-emerald-900/50'}">
                    ${item.label}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- إدارة ملف book_data.json -->
          <div class="bg-white dark:bg-[#14221d] rounded-3xl p-4 border border-stone-200 dark:border-emerald-900/50 space-y-3">
            <div>
              <h3 class="font-heading font-bold text-sm text-emeraldDeep-900 dark:text-goldSoft-400">ملف بيانات الكتاب (JSON)</h3>
              <p class="text-[11px] text-stone-500 dark:text-stone-400 mt-0.5 leading-relaxed">يمكنك تصدير ملف <code class="font-mono">book_data.json</code> لرفعه مع التطبيق على GitHub Pages أو تعديله وإعادة استيراده هنا.</p>
            </div>
            <div class="grid grid-cols-2 gap-2.5 pt-1">
              <button onclick="exportBookJson()" class="py-3 px-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 text-emeraldDeep-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 font-heading font-bold text-xs flex items-center justify-center gap-1.5">
                <span>⬇️ تصدير JSON</span>
              </button>
              <label class="py-3 px-3 rounded-2xl bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-goldSoft-400 border border-amber-200 dark:border-amber-800/50 font-heading font-bold text-xs flex items-center justify-center gap-1.5 cursor-pointer">
                <span>⬆️ استيراد JSON</span>
                <input type="file" accept=".json,application/json" onchange="importBookJson(event)" class="hidden" />
              </label>
            </div>
          </div>

          <!-- إعادة ضبط التقدم -->
          <div class="bg-white dark:bg-[#14221d] rounded-3xl p-4 border border-rose-200/80 dark:border-rose-900/40">
            <button onclick="confirmResetProgress()" class="w-full py-3 rounded-2xl bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-400 font-heading font-bold text-xs">
              إعادة ضبط التقدم والدرجات
            </button>
          </div>
        </div>
      `;
    }

    function toggleDarkMode() {
      state.settings.darkMode = !state.settings.darkMode;
      applySettings();
      saveState();
      render();
    }

    function setFontSize(size) {
      state.settings.fontSize = size;
      applySettings();
      saveState();
      render();
    }

    /** تصدير ملف book_data.json لتحميله مباشرة */
    function exportBookJson() {
      try {
        const jsonStr = JSON.stringify(bookData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'book_data.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('تم تحميل ملف book_data.json بنجاح');
      } catch (e) {
        showToast('تعذر تصدير الملف');
      }
    }

    /** استيراد ملف book_data.json محلي لتحديث محتوى التطبيق فوراً */
    function importBookJson(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.parts)) {
            showToast('هيكلية ملف JSON غير صحيحة');
            return;
          }
          bookData = parsed;
          localStorage.setItem(CUSTOM_DATA_KEY, JSON.stringify(parsed));
          showToast('تم تحديث محتوى الكتاب من ملف JSON بنجاح');
          navigateTo('home');
        } catch (err) {
          showToast('فشل قراءة الملف، تأكد من صحة صيغة JSON');
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    function confirmResetProgress() {
      openModal('إعادة ضبط التقدم', 'سيتم مسح الفصول المكتملة والدرجات والنقاط (مع الإبقاء على ملاحظاتك في المفكرة). هل تريد المتابعة؟', [
        { label: 'إلغاء', className: 'px-4 py-2 rounded-xl bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 text-xs font-bold' },
        {
          label: 'إعادة الضبط',
          className: 'px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold',
          onClick: () => {
            state.completedChapters = [];
            state.bestScores = {};
            state.points = 0;
            saveState();
            showToast('تمت إعادة ضبط التقدم بنجاح');
            render();
          }
        }
      ]);
    }

    /* =========================================================================
       11. تشغيل التطبيق عند تحميل الصفحة
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', async () => {
      loadState();
      await loadBookData();
      render();
    });
  </script>
</body>
</html>
